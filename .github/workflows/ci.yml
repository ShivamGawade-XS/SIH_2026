name: HoneyChain CI / Production Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  ai-and-security-audit:
    name: AI Service & Multi-Layer Security Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Service Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_service/requirements.txt
          pip install httpx httpx2 requests

      - name: Run Security & Penetration Audit Suite
        run: python test_security_audit.py

      - name: Run AI Model Integrity & Physics Validation
        run: python test_ai_service.py

      - name: Run Live FastAPI Microservice Endpoints
        run: python test_fastapi_endpoints.py

  smart-contracts:
    name: Polygon Smart Contract Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: contracts/package.json

      - name: Install Hardhat & OpenZeppelin Dependencies
        working-directory: ./contracts
        run: npm ci

      - name: Compile Solidity Contracts
        working-directory: ./contracts
        run: npx hardhat compile

      - name: Run Smart Contract Unit Tests
        working-directory: ./contracts
        run: npx hardhat test

  frontend-build:
    name: Next.js Frontend & Type Safety Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/honeychain?pgbouncer=true"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/honeychain"
      JWT_SECRET: "sih2026-sovereign-production-jwt-secret-key-min-32-chars-long"
      SKIP_ENV_VALIDATION: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./frontend
        run: npx prisma generate

      - name: Run Next.js Production Build
        working-directory: ./frontend
        run: npm run build
